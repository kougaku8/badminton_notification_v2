<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Badminton Notification V2 - API Test</title>

    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
          sans-serif;
        background: #f5f7fa;
        color: #222;
      }

      .container {
        max-width: 480px;
        margin: 0 auto;
      }

      .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 22px;
        text-align: center;
      }

      .description {
        color: #666;
        line-height: 1.6;
        font-size: 14px;
        text-align: center;
        margin-bottom: 24px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 10px;
        background: #4285f4;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        background: #aaa;
      }

      #result {
        margin-top: 20px;
        padding: 14px;
        border-radius: 10px;
        background: #f1f3f4;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: monospace;
        font-size: 13px;
      }

      .success {
        background: #e6f4ea !important;
        color: #137333;
      }

      .error {
        background: #fce8e6 !important;
        color: #c5221f;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>Firebase → GAS API Test</h1>

        <div class="description">
          测试 Firebase Hosting 是否可以通过 HTTP API 连接到 Google Apps
          Script。
        </div>

        <button id="testButton" onclick="testGasApi()">测试 GAS API</button>

        <div id="result">尚未测试。</div>
      </div>
    </div>

    <script>
      /*************************************************
       * GAS Web App URL
       *************************************************/

      const GAS_WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbxz1vbqjVOIcDD_GenDog-N4eEiD1_rBKHHRl0xovwKT_xfZWwUm0-rjjuNvjYG0Jlj/exec";

      /*************************************************
       * 测试 GAS API
       *************************************************/

      async function testGasApi() {
        const button = document.getElementById("testButton");

        const result = document.getElementById("result");

        button.disabled = true;

        result.className = "";

        result.textContent = "正在连接 GAS...";

        try {
          const url =
            GAS_WEB_APP_URL + "?action=checkUserName" + "&userName=TestUser";

          console.log("Request URL:", url);

          const response = await fetch(url, {
            method: "GET",
          });

          console.log("HTTP status:", response.status);

          if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
          }

          const data = await response.json();

          console.log("API response:", data);

          result.className = "success";

          result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          console.error("API error:", error);

          result.className = "error";

          result.textContent = "API 调用失败：\n\n" + error.message;
        } finally {
          button.disabled = false;
        }
      }
    </script>
  </body>
</html>
