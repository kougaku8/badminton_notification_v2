/*************************************************

*************************************************/
function initializeLanguage() {

try {

const savedLanguage =
  localStorage.getItem(
    LANGUAGE_STORAGE_KEY
  );


if (
  savedLanguage === 'zh' ||
  savedLanguage === 'ja'
) {

  currentLanguage =

    navigator.language || '';


  if (
    browserLanguage
      .toLowerCase()
      .startsWith('ja')
  ) {

    currentLanguage =
      'ja';

  } else {

    currentLanguage =
      'zh';

  }

}

} catch (error) {

  'zh';

}

applyLanguage();

}

/*************************************************

Set Language
*************************************************/
function setLanguage(language) {

if (
language !== 'zh' &&
language !== 'ja'
) {

return;

}

currentLanguage =
language;

try {

localStorage.setItem(
  LANGUAGE_STORAGE_KEY,
  language
);

} catch (error) {
}

applyLanguage();

}

/*************************************************

Apply Language
*************************************************/
function applyLanguage() {

const texts =
translations[currentLanguage];

document
.querySelectorAll('[data-i18n]')
.forEach(function(element) {

  const key =
    element.getAttribute(
      'data-i18n'
    );


  if (
    texts[key] !== undefined
  ) {

    element.innerHTML =
      texts[key];

  }

});

document
.querySelectorAll('[data-i18n-placeholder]')
.forEach(function(element) {

  const key =
    element.getAttribute(
      'data-i18n-placeholder'
    );


  if (
    texts[key] !== undefined
  ) {

    element.placeholder =
      texts[key];

  }

});

document.title =
texts.pageTitle;

document
.getElementById('languageZh')
.classList.toggle(
'active',
currentLanguage === 'zh'
);

document
.getElementById('languageJa')
.classList.toggle(
'active',
currentLanguage === 'ja'

}

const randomPart =
Math.random()
.toString(36)
.substring(2, 10);

return (
'device_' +

'_' +

);

/*************************************************

Build GAS URL
*************************************************/
function buildApiUrl(
action,
params
) {

const url =
new URL(GAS_WEB_APP_URL);

url.searchParams.set(
'action',
action
);

if (params) {

Object.keys(params)
  .forEach(function(key) {

    const value =
      params[key];


    if (
      value !== undefined &&
      value !== null
    ) {

      url.searchParams.set(
        key,
        value
      );

    }

  });

}

return url.toString();

}

/*************************************************

GAS API
*************************************************/
async function callGasApi(
  action,
  params
) {

  const url =
    buildApiUrl(
      action,
      params
    );

  console.log(
    'GAS API:',
    action
  );

  console.log(
    'GAS URL:',
    url
  );


  const response =
    await fetch(
      url,
      {
        method: 'GET'
      }
    );


  if (!response.ok) {

    throw new Error(
      'HTTP ' +
      response.status
    );

  }


  const result =
    await response.json();


  console.log(
    'GAS response:',
    result
  );


  return result;

}

} finally {

setCheckButtonLoading(false);

}

/*************************************************

Get FCM Token
*************************************************/
async function getFcmToken() {

const texts =
translations[currentLanguage];

if (!firebaseInitialized) {

console.warn(
  'Firebase is not initialized.'
);

return '';

}

/*

Service Worker
*/
if (
!('serviceWorker' in navigator)
) {

throw new Error(
  'Service Worker is not supported.'
);

}

/*

Notification API
*/
if (
!('Notification' in window)
) {

throw new Error(
  'Notification API is not supported.'
);

}

/*

Request permission
*/
let permission =
Notification.permission;

if (
permission !== 'granted'
) {

permission =
  await Notification.requestPermission();

}

console.log(
'Notification permission:',
permission
);

if (
permission !== 'granted'
) {

throw new Error(
  texts.fcmDenied
);

}

/*

Register Firebase Messaging SW
*/
const registration =
await navigator.serviceWorker.register(
'/firebase-messaging-sw.js'
);

console.log(
'FCM service worker registered:',
registration.scope
);

/*

Get FCM registration token
*/
const token =
await messaging.getToken({

  vapidKey:
    VAPID_KEY,

  serviceWorkerRegistration:
    registration

});

if (!token) {

throw new Error(
  texts.fcmError
);

}

console.log(
'FCM Token:',
token
);

return token;

}

/*************************************************

Platform
*************************************************/
function getPlatform() {

const ua =
navigator.userAgent || '';

if (
/Android/i.test(ua)
) {

return 'android';

}

if (
/iPhone|iPad|iPod/i.test(ua)
) {

return 'ios';

}

return 'web';

}

element.textContent =

element.className =

(type || '');

}

document.getElementById(
'message'

element.className =
'message hidden';

element.textContent =
'';
